        blockedByMe:
          type: boolean
        blockedByThem:
          type: boolean
        mutedByMe:
          type: boolean
      required: [following, inCircle, blockedByMe, blockedByThem, mutedByMe]
    ProfileVisibility:
      type: object
      properties:
        canViewPublicContent:
          type: boolean
        canViewCircleContent:
          type: boolean
      required: [canViewPublicContent, canViewCircleContent]
    ProfileContentPage:
      type: object
      description: Generic paginated content shape used by media modules not yet connected to the backend.
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        nextCursor:
          type: [string, "null"]
      required: [items, nextCursor]
    AccountStats:
      type: object
      properties:
        posts:
          type: integer
          minimum: 0
        followers:
          type: integer
          minimum: 0
        following:
          type: integer
          minimum: 0
        circles:
          type: integer
          minimum: 0
      required: [posts, followers, following, circles]
    AccountView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
          maxLength: 100
        bio:
          type: string
        avatarUrl:
          type: [string, "null"]
        coverUrl:
          type: [string, "null"]
        location:
          type: [string, "null"]
        website:
          type: [string, "null"]
          format: uri
          pattern: "^https?://"
        accountType:
          type: string
          enum: [personal, commercial]
        isPrivate:
          type: boolean
        joinedAt:
          type: string
          format: date-time
        relationship:
          $ref: "#/components/schemas/RelationshipView"
        stats:
          $ref: "#/components/schemas/AccountStats"
        version:
          type: integer
          minimum: 1
      required:
        - id
        - username
        - displayName
        - bio
        - avatarUrl
        - coverUrl
        - location
        - website
        - accountType
        - isPrivate
        - joinedAt
        - relationship
        - stats
        - version
    MyAccountResponse:
      type: object
      description: Owner-only account details. Age is intentionally excluded after registration and is never returned to the client.
      properties:
        account:
          $ref: "#/components/schemas/AccountView"
        email:
          type: string
          format: email
          maxLength: 254
          description: Verified email address visible only to the authenticated owner.
        firstName:
          type: [string, "null"]
          maxLength: 80
        lastName:
          type: [string, "null"]
          maxLength: 80
        publicNameChangeAvailableAt:
          type: string
          format: date-time
          description: The next date and time when the owner may change the personal or commercial public name.
        usernameChangeAvailableAt:
          type: string
          format: date-time
          description: The next date and time when the owner may change the account's social identifier.
        commercialProfile:
          oneOf:
            - $ref: "#/components/schemas/OwnerCommercialProfile"
            - type: "null"
      required:
        - account
        - email
        - firstName
        - lastName
        - publicNameChangeAvailableAt
        - usernameChangeAvailableAt
        - commercialProfile
    OwnerCommercialProfile:
      type: object
      description: Full commercial registration details returned only to the authenticated owner.
      properties:
        categoryKey:
          type: string
          minLength: 1
          maxLength: 40
        discoveryKind:
          type: string
          enum: [place, provider]
        address:
          type: string
          minLength: 1
          maxLength: 250
        postalCode:
          type: string
          minLength: 1
          maxLength: 20
        cityName:
          type: string
          minLength: 1
          maxLength: 120
        stateName:
          type: string
          minLength: 1
          maxLength: 100
        countryName:
          type: string
          minLength: 1
          maxLength: 100
      required: [categoryKey, discoveryKind, address, postalCode, cityName, stateName, countryName]
    ProfileResponse:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/AccountView"
        visibility:
          $ref: "#/components/schemas/ProfileVisibility"
        posts:
          $ref: "#/components/schemas/PostPage"
        articles:
          $ref: "#/components/schemas/PostPage"
        media:
          $ref: "#/components/schemas/ProfileContentPage"
      required: [account, visibility, posts, articles, media]
    AccountPatch:
      type: object
      description: >
        Version is required and at least one editable field must be provided.
        Account type is never changed by this endpoint. Personal accounts use
        firstName and lastName together; their combined public name cannot
        exceed 100 characters. Commercial accounts use displayName and the
        complete commercialProfile object. Public name and username changes
        are each limited to once every 30 days, beginning 30 days after
        registration. A previous username remains unavailable to every account
        for 30 days after a change. Age is collected only during registration
        and cannot be read or changed through this endpoint.
        The server rejects fields
        that do not match the authenticated account type.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          description: Username is trimmed and normalized to lowercase before validation. A change is allowed 30 days after registration or the previous change; the old username is reserved for all accounts for 30 days.
        displayName:
          type: string
          minLength: 2
          maxLength: 100
          description: For commercial accounts, the public business or service-provider name. A name change is allowed 30 days after registration or the previous name change.
        firstName:
          type: string
          minLength: 2
          maxLength: 80
          description: Personal account only; must be paired with lastName. The public name can be changed once every 30 days.
        lastName:
          type: string
          minLength: 2
          maxLength: 80
          description: Personal account only; must be paired with firstName. The public name can be changed once every 30 days.
        commercialProfile:
          $ref: "#/components/schemas/CommercialAccountPatch"
        bio:
          type: string
          maxLength: 500
        location:
          type: [string, "null"]
          maxLength: 160
        website:
          type: [string, "null"]
          description: When provided, the URL must use HTTP or HTTPS.
          format: uri
          pattern: "^https?://"
          maxLength: 2048
        version:
          type: integer
          minimum: 1
      required: [version]
      additionalProperties: false
    CommercialAccountPatch:
      type: object
      description: Full owner-editable commercial address. Only accepted for commercial accounts.
      properties:
        address:
          type: string
          minLength: 5
          maxLength: 250
        postalCode:
          type: string
          minLength: 5
          maxLength: 20
        cityName:
          type: string
          minLength: 2
          maxLength: 120
        stateName:
          type: string
          minLength: 2
          maxLength: 100
        countryName:
          type: string
          minLength: 2
          maxLength: 100
      required: [address, postalCode, cityName, stateName, countryName]
      additionalProperties: false
    PrivacySettings:
      type: object
      properties:
        profileVisibility:
          type: string
          enum: [public, private]
        messages:
          type: string
          enum: [everyone, circle, nobody]
        readReceipts:
          type: boolean
        version:
          type: integer
          minimum: 1
      required: [profileVisibility, messages, readReceipts, version]
    PrivacySettingsWrite:
      allOf:
        - $ref: "#/components/schemas/PrivacySettings"
      description: All fields are required, including the version used for optimistic concurrency.
    AccountPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountView"
        nextCursor:
          type: [string, "null"]
      required: [items, nextCursor]
    AccountList:
