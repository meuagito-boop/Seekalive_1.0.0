          $ref: "#/components/responses/Unauthorized"
  /v1/social/blocks:
    get:
      operationId: getBlockedAccounts
      tags: [social-graph]
      summary: List accounts blocked by the authenticated account
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Blocked account list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/social/blocks/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    put:
      operationId: blockAccount
      tags: [social-graph]
      summary: Block an account and remove follow edges and pending requests in both directions
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Account blocked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unblockAccount
      tags: [social-graph]
      summary: Remove a block initiated by the authenticated account
      description: Previously removed follow edges and requests are not restored.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Block removed if it was initiated by the authenticated account
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/social/posts:
    post:
      operationId: createSocialPost
      tags: [feed]
      summary: Create a text publication
      description: >
        The authenticated account is always the author. The optional authorId
        is accepted only for compatibility and must equal the session account.
        Media uploads are not enabled; media fields are rejected.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreate"
      responses:
        "201":
          description: Publication created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/social/posts/{postId}:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      operationId: getSocialPost
      tags: [feed]
      summary: Read a publication when its current audience permits
      security:
        - sessionCookie: []
        - {}
      responses:
        "200":
          description: Readable publication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSocialPost
      tags: [feed]
      summary: Delete the authenticated account's publication
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Publication deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/social/articles:
    post:
      operationId: createSocialArticle
      tags: [feed]
      summary: Create a text-only article
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleCreate"
      responses:
        "201":
          description: Article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/social/articles/{postId}:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      operationId: getSocialArticle
      tags: [feed]
      summary: Read an article when its current audience permits
      security:
        - sessionCookie: []
        - {}
      responses:
        "200":
          description: Readable article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/social/accounts/{accountId}/posts:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/PageLimit"
      - $ref: "#/components/parameters/PageCursor"
    get:
      operationId: getSocialAccountPosts
      tags: [feed]
      summary: List currently readable posts or articles on an account profile
      description: >
        Results use stable chronological pagination and re-check profile privacy,
        approved follows, mutual Círculo membership, and bilateral blocks.
      security:
        - sessionCookie: []
        - {}
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [all, text, article]
            default: all
      responses:
        "200":
          description: Paginated readable content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-seekalive_session
    preAuthCookie:
      type: apiKey
      in: cookie
      name: __Host-seekalive_pre_auth
    deviceCookie:
      type: apiKey
      in: cookie
      name: __Host-seekalive_device
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 20
        description: Username is normalized to lowercase before validation.
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 32
  responses:
    Unauthorized:
      description: Missing, expired, or unverified account session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountUnavailable:
      description: The account is blocked from security-sensitive changes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: CSRF failure, blocked relationship, or inaccessible private profile
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Account or relationship not found or intentionally undisclosed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: Invalid request input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Optimistic concurrency conflict or duplicate username
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: Request limit exceeded; retry after the interval in Retry-After.
      headers:
        Retry-After:
          description: Number of seconds before another request may be accepted.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    EmailDeliveryUnavailable:
      description: The configured e-mail provider is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: Profile data is inconsistent or the server could not complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              minimum: 1000
              maximum: 1899
              description: Unique numeric application/domain error code. HTTP response status is separate transport metadata and is catalogued in shared/contracts/src/errorCodes.ts.
            key:
              type: string
              description: Stable symbolic error key for client-side handling.
            message:
              type: string
            requestId:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                required: [field, message]
            retryAfterSeconds:
              type: integer
              minimum: 1
            attemptsRemaining:
              type: integer
              minimum: 0
            resendAvailableAt:
              type: string
              format: date-time
            supportEmail:
              type: string
              format: email
          required: [code, key, message, requestId]
      required: [error]
    CsrfToken:
      type: object
      properties:
        csrfToken:
          type: string
          minLength: 1
      required: [csrfToken]
    AuthAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 3
          maxLength: 20
          description: Lowercase social identifier after server normalization.
        displayName:
          type: string
        accountType:
          type: string
          enum: [personal, commercial]
        joinedAt:
          type: string
          format: date-time
        onboardingCompleted:
          type: boolean
      required:
        [id, username, displayName, accountType, joinedAt, onboardingCompleted]
    AuthSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required: [id, createdAt, expiresAt]
    AuthResult:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/AuthAccount"
        session:
          $ref: "#/components/schemas/AuthSession"
        csrfToken:
          type: string
          minLength: 1
        emailVerified:
          type: boolean
          const: true
      required: [account, session, csrfToken, emailVerified]
    AuthenticatedCurrentSession:
      type: object
      properties:
        authenticated:
          type: boolean
          const: true
        account:
          $ref: "#/components/schemas/AuthAccount"
        session:
          $ref: "#/components/schemas/AuthSession"
      required: [authenticated, account, session]
    UnauthenticatedCurrentSession:
      type: object
      properties:
        authenticated:
          type: boolean
          const: false
        account:
          type: "null"
        session:
          type: "null"
      required: [authenticated, account, session]
    CurrentSession:
      oneOf:
        - $ref: "#/components/schemas/AuthenticatedCurrentSession"
        - $ref: "#/components/schemas/UnauthenticatedCurrentSession"
      discriminator:
        propertyName: authenticated
    DeviceVerificationRequired:
      type: object
      properties:
        status:
          type: string
          const: device_verification_required
        challengeId:
          type: string
          format: uuid
        emailMasked:
          type: string
        expiresAt:
          type: string
          format: date-time
        resendAvailableAt:
          type: string
          format: date-time
        message:
          type: string
      required:
        [
          status,
          challengeId,
          emailMasked,
          expiresAt,
          resendAvailableAt,
          message,
        ]
    AccountDeletionPendingResponse:
      type: object
      properties:
        status:
          const: account_deletion_pending
        deletionScheduledFor:
          type: string
          format: date-time
        emailMasked:
          type: string
        message:
          type: string
      required: [status, deletionScheduledFor, emailMasked, message]
    DeviceVerificationResent:
      type: object
      properties:
        status:
          type: string
          const: verification_code_resent
        expiresAt:
          type: string
          format: date-time
        resendAvailableAt:
          type: string
          format: date-time
      required: [status, expiresAt, resendAvailableAt]
    PasswordUpdateChallenge:
      type: object
      properties:
        status:
          type: string
          const: password_update_verification_required
        challengeId:
          type: string
          format: uuid
        emailMasked:
          type: string
        expiresAt:
          type: string
          format: date-time
        message:
          type: string
      required: [status, challengeId, emailMasked, expiresAt, message]
    VerificationRequired:
      type: object
      properties:
        status:
          type: string
          const: verification_required
        message:
          type: string
      required: [status, message]
    EmailVerificationConfirmation:
      oneOf:
        - $ref: "#/components/schemas/AuthResult"
        - $ref: "#/components/schemas/LegacyPasswordUpdateRequired"
    LegacyPasswordUpdateRequired:
      type: object
      properties:
        emailVerified:
          type: boolean
          const: true
        passwordUpdateRequired:
          type: boolean
          const: true
        message:
          type: string
      required: [emailVerified, passwordUpdateRequired, message]
    PasswordResetRequested:
      type: object
      properties:
        status:
          type: string
          const: reset_requested
        message:
          type: string
      required: [status, message]
    PasswordResetComplete:
      type: object
      properties:
        status:
          type: string
          const: password_reset
      required: [status]
    PasswordUpdated:
      type: object
      properties:
        status:
          type: string
          const: password_updated
      required: [status]
    AuthSessionListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean
      required: [id, createdAt, expiresAt, isCurrent]
    AuthSessionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuthSessionListItem"
        nextCursor:
          type: [string, "null"]
      required: [items, nextCursor]
    TrustedDevice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean
      required: [id, firstSeenAt, lastSeenAt, isCurrent]
    TrustedDevicePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrustedDevice"
        hasMore:
          type: boolean
      required: [items, hasMore]
    OtherSessionsRevoked:
      type: object
      properties:
        status:
          type: string
          const: other_sessions_revoked
        revokedCount:
          type: integer
          minimum: 0
      required: [status, revokedCount]
    OtherDevicesRevoked:
      type: object
      properties:
        status:
          type: string
          const: other_devices_revoked
        revokedCount:
          type: integer
          minimum: 0
      required: [status, revokedCount]
    RegisterRequest:
      oneOf:
        - $ref: "#/components/schemas/PersonalRegistration"
        - $ref: "#/components/schemas/CommercialRegistration"
      discriminator:
        propertyName: accountType
    RegistrationCommon:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          description: Trimmed and normalized to lowercase before the final username rule is applied.
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and normalized to lowercase by the server.
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Must include an uppercase letter, lowercase letter, number, and special character.
        passwordConfirmation:
          type: string
          minLength: 8
          maxLength: 128
          description: Must match password.
        acceptedTermsVersion:
          type: string
          const: v1
        age:
          type: integer
          minimum: 18
          maximum: 120
          description: Private eligibility data; it is not returned in public account responses.
      required:
        [
          username,
          email,
          password,
          passwordConfirmation,
          acceptedTermsVersion,
          age,
        ]
    PersonalRegistration:
      allOf:
        - $ref: "#/components/schemas/RegistrationCommon"
        - type: object
          properties:
            accountType:
              type: string
              const: personal
            firstName:
              type: string
              minLength: 2
              maxLength: 80
            lastName:
              type: string
              minLength: 2
              maxLength: 80
          required: [accountType, firstName, lastName]
    CommercialRegistration:
      allOf:
        - $ref: "#/components/schemas/RegistrationCommon"
        - type: object
          properties:
            accountType:
              type: string
              const: commercial
            businessName:
              type: string
              minLength: 2
              maxLength: 100
            categoryKey:
              type: string
              enum:
                [restaurantes, bares, cafes, servicos, compras, saude, lazer]
            discoveryKind:
              type: string
              enum: [place, provider]
            address:
              type: string
              minLength: 3
              maxLength: 250
            postalCode:
              type: string
              minLength: 5
              maxLength: 20
            city:
              type: string
              minLength: 2
              maxLength: 120
            state:
              type: string
              minLength: 2
              maxLength: 100
            country:
              type: string
              minLength: 2
              maxLength: 100
          required:
            [
              accountType,
              businessName,
              categoryKey,
              discoveryKind,
              address,
              postalCode,
              city,
              state,
              country,
            ]
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
          description: Username or e-mail; surrounding whitespace is trimmed by the server.
        password:
          type: string
          minLength: 8
          maxLength: 128
      required: [identifier, password]
    ChallengeResendInput:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
      required: [challengeId]
    PasswordPolicyUpdateRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
        currentPassword:
          type: string
          minLength: 8
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: Must differ from the current password and include uppercase, lowercase, numeric, and special characters.
        passwordConfirmation:
          type: string
          minLength: 8
          maxLength: 128
          description: Must match newPassword.
      required: [identifier, currentPassword, newPassword, passwordConfirmation]
    EmailVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required: [email]
    EmailVerificationConfirm:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          pattern: "^[0-9]{6}$"
      required: [email, code]
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required: [email]
    PasswordResetConfirm:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          pattern: "^[0-9]{6}$"
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: Must include uppercase, lowercase, numeric, and special characters.
        passwordConfirmation:
          type: string
          minLength: 8
          maxLength: 128
          description: Must match newPassword.
      required: [email, code, newPassword, passwordConfirmation]
    AccountEmailChangeRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 8
          maxLength: 128
        newEmail:
          type: string
          format: email
          maxLength: 254
      required: [currentPassword, newEmail]
      additionalProperties: false
    AccountPasswordChangeRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 8
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: Must include uppercase, lowercase, numeric, and special characters.
        passwordConfirmation:
          type: string
          minLength: 8
          maxLength: 128
      required: [currentPassword, newPassword, passwordConfirmation]
      additionalProperties: false
    ChallengeConfirmInput:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
      required: [challengeId, code]
      additionalProperties: false
    EmailChangeCurrentCodeResponse:
      type: object
      properties:
        status:
          const: current_email_verification_required
        challengeId:
          type: string
          format: uuid
        currentEmailMasked:
          type: string
        newEmailMasked:
          type: string
        expiresAt:
          type: string
          format: date-time
        message:
          type: string
      required:
        [
          status,
          challengeId,
          currentEmailMasked,
          newEmailMasked,
          expiresAt,
          message,
        ]
    EmailChangeNewCodeResponse:
      type: object
      properties:
        status:
          const: new_email_verification_required
        challengeId:
          type: string
          format: uuid
        newEmailMasked:
          type: string
        expiresAt:
          type: string
          format: date-time
        message:
          type: string
      required: [status, challengeId, newEmailMasked, expiresAt, message]
    PasswordChangeCodeResponse:
      type: object
      properties:
        status:
          const: password_change_verification_required
        challengeId:
          type: string
          format: uuid
        emailMasked:
          type: string
        expiresAt:
          type: string
          format: date-time
        message:
          type: string
      required: [status, challengeId, emailMasked, expiresAt, message]
    AccountDeletionCodeResponse:
      type: object
      properties:
        status:
          const: verification_code_sent
        challengeId:
          type: string
          format: uuid
        emailMasked:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [status, challengeId, emailMasked, expiresAt]
    AccountDeletionCodeRequest:
      type: object
      additionalProperties: false
    AccountDeletionConfirmation:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
      required: [challengeId, code]
      additionalProperties: false
    AccountRestorationConfirmation:
      type: object
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
      required: [identifier, password, challengeId, code]
      additionalProperties: false
    AccountRestoredResponse:
      type: object
      properties:
        status:
          const: account_restored
      required: [status]
    AccountDeletionScheduled:
      type: object
      properties:
        status:
          const: deletion_scheduled
        deletionScheduledFor:
          type: string
          format: date-time
      required: [status, deletionScheduledFor]
    AccountEmailChangeResult:
      type: object
      properties:
        status:
          const: email_changed
        email:
          type: string
          format: email
        securityNoticeSent:
          type: boolean
      required: [status, email, securityNoticeSent]
    AccountPasswordChangeResult:
      type: object
      properties:
        status:
          const: password_changed
      required: [status]
    RelationshipView:
      type: object
      properties:
        following:
          type: string
          enum: [none, pending, accepted]
        inCircle:
          type: boolean
        blockedByMe:
          type: boolean
        blockedByThem:
          type: boolean
        mutedByMe:
          type: boolean
      required: [following, inCircle, blockedByMe, blockedByThem, mutedByMe]
    ProfileVisibility:
      type: object
      properties:
        canViewPublicContent:
          type: boolean
        canViewCircleContent:
          type: boolean
      required: [canViewPublicContent, canViewCircleContent]
    ProfileContentPage:
      type: object
      description: Generic paginated content shape used by media modules not yet connected to the backend.
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        nextCursor:
          type: [string, "null"]
      required: [items, nextCursor]
    AccountStats:
      type: object
      properties:
        posts:
          type: integer
          minimum: 0
        followers:
          type: integer
          minimum: 0
        following:
          type: integer
          minimum: 0
        circles:
          type: integer
          minimum: 0
      required: [posts, followers, following, circles]
    AccountView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
          maxLength: 100
        bio:
          type: string
        avatarUrl:
          type: [string, "null"]
        coverUrl:
          type: [string, "null"]
        location:
          type: [string, "null"]
        website:
          type: [string, "null"]
          format: uri
          pattern: "^https?://"
        accountType:
          type: string
          enum: [personal, commercial]
        isPrivate:
          type: boolean
        joinedAt:
          type: string
          format: date-time
        relationship:
          $ref: "#/components/schemas/RelationshipView"
        stats:
          $ref: "#/components/schemas/AccountStats"
        version:
          type: integer
          minimum: 1
      required:
        - id
        - username
        - displayName
        - bio
        - avatarUrl
        - coverUrl
        - location
        - website
        - accountType
        - isPrivate
        - joinedAt
        - relationship
        - stats
        - version
    MyAccountResponse:
      type: object
      description: Owner-only account details. Age is intentionally excluded after registration and is never returned to the client.
      properties:
        account:
          $ref: "#/components/schemas/AccountView"
        email:
          type: string
          format: email
          maxLength: 254
          description: Verified email address visible only to the authenticated owner.
        firstName:
          type: [string, "null"]
          maxLength: 80
        lastName:
          type: [string, "null"]
          maxLength: 80
        publicNameChangeAvailableAt:
          type: string
          format: date-time
          description: The next date and time when the owner may change the personal or commercial public name.
        usernameChangeAvailableAt:
          type: string
          format: date-time
          description: The next date and time when the owner may change the account's social identifier.
        commercialProfile:
          oneOf:
            - $ref: "#/components/schemas/OwnerCommercialProfile"
            - type: "null"
      required:
        - account
        - email
        - firstName
        - lastName
        - publicNameChangeAvailableAt
        - usernameChangeAvailableAt
        - commercialProfile
    OwnerCommercialProfile:
      type: object
      description: Full commercial registration details returned only to the authenticated owner.
      properties:
        categoryKey:
          type: string
          minLength: 1
          maxLength: 40
        discoveryKind:
          type: string
          enum: [place, provider]
        address:
          type: string
          minLength: 1
          maxLength: 250
        postalCode:
          type: string
          minLength: 1
          maxLength: 20
        cityName:
          type: string
          minLength: 1
          maxLength: 120
        stateName:
          type: string
          minLength: 1
          maxLength: 100
        countryName:
          type: string
          minLength: 1
          maxLength: 100
      required:
        [
          categoryKey,
          discoveryKind,
          address,
          postalCode,
          cityName,
          stateName,
          countryName,
        ]
    ProfileResponse:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/AccountView"
        visibility:
          $ref: "#/components/schemas/ProfileVisibility"
        posts:
          $ref: "#/components/schemas/PostPage"
        articles:
          $ref: "#/components/schemas/PostPage"
        media:
          $ref: "#/components/schemas/ProfileContentPage"
      required: [account, visibility, posts, articles, media]
    AccountPatch:
      type: object
      description: >
        Version is required and at least one editable field must be provided.
        Account type is never changed by this endpoint. Personal accounts use
        firstName and lastName together; their combined public name cannot
        exceed 100 characters. Commercial accounts use displayName and the
        complete commercialProfile object. Public name and username changes
        are each limited to once every 30 days, beginning 30 days after
        registration. A previous username remains unavailable to every account
        for 30 days after a change. Age is collected only during registration
        and cannot be read or changed through this endpoint.
        The server rejects fields
        that do not match the authenticated account type.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          description: Username is trimmed and normalized to lowercase before validation. A change is allowed 30 days after registration or the previous change; the old username is reserved for all accounts for 30 days.
        displayName:
          type: string
          minLength: 2
          maxLength: 100
          description: For commercial accounts, the public business or service-provider name. A name change is allowed 30 days after registration or the previous name change.
        firstName:
          type: string
          minLength: 2
          maxLength: 80
          description: Personal account only; must be paired with lastName. The public name can be changed once every 30 days.
        lastName:
          type: string
          minLength: 2
          maxLength: 80
          description: Personal account only; must be paired with firstName. The public name can be changed once every 30 days.
        commercialProfile:
          $ref: "#/components/schemas/CommercialAccountPatch"
        bio:
          type: string
          maxLength: 500
        location:
          type: [string, "null"]
          maxLength: 160
        website:
          type: [string, "null"]
          description: When provided, the URL must use HTTP or HTTPS.
          format: uri
          pattern: "^https?://"
          maxLength: 2048
        version:
          type: integer
          minimum: 1
      required: [version]
      additionalProperties: false
    CommercialAccountPatch:
      type: object
      description: Full owner-editable commercial address. Only accepted for commercial accounts.
      properties:
        address:
          type: string
          minLength: 5
          maxLength: 250
        postalCode:
          type: string
          minLength: 5
          maxLength: 20
        cityName:
          type: string
          minLength: 2
          maxLength: 120
        stateName:
          type: string
          minLength: 2
          maxLength: 100
        countryName:
          type: string
          minLength: 2
          maxLength: 100
      required: [address, postalCode, cityName, stateName, countryName]
      additionalProperties: false
    PrivacySettings:
      type: object
      properties:
        profileVisibility:
          type: string
          enum: [public, private]
        messages:
          type: string
          enum: [everyone, circle, nobody]
        readReceipts:
          type: boolean
        version:
          type: integer
          minimum: 1
      required: [profileVisibility, messages, readReceipts, version]
    PrivacySettingsWrite:
      allOf:
        - $ref: "#/components/schemas/PrivacySettings"
      description: All fields are required, including the version used for optimistic concurrency.
    AccountPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountView"
        nextCursor:
          type: [string, "null"]
      required: [items, nextCursor]
    AccountList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountView"
        nextCursor:
          type: [string, "null"]
      required: [items, nextCursor]
    FollowRequest:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/AccountView"
        createdAt:
          type: string
          format: date-time
      required: [account, createdAt]
    FollowRequestPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FollowRequest"
        nextCursor:
          type: [string, "null"]
      required: [items, nextCursor]
    CircleMember:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/AccountView"
        isMutual:
          type: boolean
          const: true
      required: [account, isMutual]
    CirclePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CircleMember"
        nextCursor:
          type: [string, "null"]
      required: [items, nextCursor]
    FollowState:
      type: object
      properties:
        status:
          type: string
          enum: [pending, accepted]
        updatedAt:
          type: string
          format: date-time
      required: [status, updatedAt]
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        content:
          type: string
          maxLength: 280
        createdAt:
          type: string
          format: date-time
        audience:
          type: string
          enum: [public, circles, private]
        type:
          type: string
          const: text
        format:
          type: string
          enum: [text, article]
        article:
          type: object
          properties:
            title:
              type: string
              maxLength: 160
            body:
              type: string
              maxLength: 50000
          required: [title, body]
        likes:
          type: integer
          minimum: 0
        comments:
          type: integer
          minimum: 0
        reposts:
          type: integer
          minimum: 0
        shares:
          type: integer
          minimum: 0
        isLiked:
          type: boolean
        isReposted:
          type: boolean
      required:
        [
          id,
          authorId,
          content,
          createdAt,
          audience,
          type,
          format,
          likes,
          comments,
          reposts,
          shares,
          isLiked,
          isReposted,
        ]
    PostCreate:
      type: object
      description: Text-only post. Media fields and third-party URLs are not accepted.
      properties:
        authorId:
          type: string
          format: uuid
          description: Optional compatibility field; must match the authenticated account.
        content:
          type: string
          minLength: 1
          maxLength: 280
        audience:
          type: string
          enum: [public, circles, private]
        format:
          type: string
          enum: [text]
      required: [content, audience]
      additionalProperties: false
    ArticleCreate:
      type: object
      description: Text-only article. Media and external reference previews are not enabled in this slice.
      properties:
        authorId:
          type: string
          format: uuid
          description: Optional compatibility field; must match the authenticated account.
        content:
          type: string
          maxLength: 280
          default: ""
        audience:
          type: string
          enum: [public, circles, private]
        format:
          type: string
          const: article
        article:
          type: object
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 160
            body:
              type: string
              minLength: 1
              maxLength: 50000
          required: [title, body]
          additionalProperties: false
      required: [audience, article]
      additionalProperties: false
    PostPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        nextCursor:
          type: [string, "null"]
      required: [items, nextCursor]
