    AccountPasswordChangeRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 8
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: Must include uppercase, lowercase, numeric, and special characters.
        passwordConfirmation:
          type: string
          minLength: 8
          maxLength: 128
      required: [currentPassword, newPassword, passwordConfirmation]
      additionalProperties: false
    ChallengeConfirmInput:
