openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account registration, verification, login, and session security
  - name: profiles
    description: Public profile views and account settings
  - name: social-graph
    description: Follows, private follow requests, mutual circles, and blocks
  - name: feed
    description: Text posts and articles with server-enforced audience visibility
  - name: auth-security
    description: Authenticated e-mail and password changes
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/auth/csrf:
    get:
      operationId: getAuthCsrfToken
      tags: [auth]
      summary: Obtain a CSRF token for the current browser context
      description: Rotates the active session token or creates a pre-authentication token.
      responses:
        "200":
          description: CSRF token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
  /v1/auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Read the current authentication state
      security:
        - sessionCookie: []
        - {}
      responses:
        "200":
          description: Authenticated or signed-out state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
  /v1/auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create a personal or commercial account
      description: Creates an unverified account and requests e-mail verification; it does not create an authenticated session.
      security:
        - preAuthCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Verification is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationRequired"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/EmailDeliveryUnavailable"
  /v1/auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Authenticate with username or e-mail and password
      description: An unrecognized installation receives a verification challenge instead of a session.
      security:
        - preAuthCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "202":
          description: A code is required for a new installation or the account is pending deletion
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DeviceVerificationRequired"
                  - $ref: "#/components/schemas/AccountDeletionPendingResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Email delivery or required development database migration unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/auth/device-verification/confirm:
    post:
      operationId: confirmAuthDeviceVerification
      tags: [auth]
      summary: Confirm a new installation with its e-mail code
      security:
        - preAuthCookie: []
          deviceCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeConfirmInput"
      responses:
        "200":
          description: Installation recognized and authenticated session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/device-verification/resend:
    post:
      operationId: resendAuthDeviceVerification
      tags: [auth]
      summary: Resend the code for an unrecognized installation
      security:
        - preAuthCookie: []
          deviceCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeResendInput"
      responses:
        "200":
          description: A new verification code was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceVerificationResent"
        "400":
          $ref: "#/components/responses/ValidationError"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/EmailDeliveryUnavailable"
  /v1/auth/password/update:
    post:
      operationId: requestAuthPasswordPolicyUpdate
      tags: [auth]
      summary: Request a password-policy update
      description: Requires the current password and sends a code to the verified e-mail.
      security:
        - preAuthCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordPolicyUpdateRequest"
      responses:
        "202":
          description: E-mail confirmation is required before the password update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordUpdateChallenge"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/EmailDeliveryUnavailable"
  /v1/auth/password/update/confirm:
    post:
      operationId: confirmAuthPasswordPolicyUpdate
      tags: [auth]
      summary: Confirm a password-policy update with its e-mail code
      security:
        - preAuthCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeConfirmInput"
      responses:
        "200":
          description: Password updated; previous sessions and trusted installation are revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordUpdated"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/verification:
    post:
      operationId: requestAuthEmailVerification
      tags: [auth]
      summary: Request a new e-mail verification code
      description: Uses a generic response so account existence is not disclosed.
      security:
        - preAuthCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationRequest"
      responses:
        "202":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationRequired"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/EmailDeliveryUnavailable"
  /v1/auth/verification/confirm:
    post:
      operationId: confirmAuthEmailVerification
      tags: [auth]
      summary: Confirm an account e-mail address
      security:
        - preAuthCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationConfirm"
      responses:
        "200":
          description: E-mail verified; authentication or a mandatory password update may follow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailVerificationConfirmation"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/password/reset/request:
    post:
      operationId: requestAuthPasswordReset
      tags: [auth]
      summary: Request a password-reset code
      description: Uses a generic response so account existence is not disclosed.
      security:
        - preAuthCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequested"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/password/reset/confirm:
    post:
      operationId: confirmAuthPasswordReset
      tags: [auth]
      summary: Complete a password reset with its e-mail code
      security:
        - preAuthCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "200":
          description: Password reset; active sessions and trusted installation are revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetComplete"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/sessions:
    get:
      operationId: listAuthSessions
      tags: [auth]
      summary: List active sessions for the authenticated account
      security:
        - sessionCookie: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 16
      responses:
        "200":
          description: Current page of active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/sessions/others:
    delete:
      operationId: revokeOtherAuthSessions
      tags: [auth]
      summary: Revoke every active session except the current one
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Other sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtherSessionsRevoked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeAuthSession
      tags: [auth]
      summary: Revoke another active session
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session revoked
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/logout:
    post:
      operationId: logoutAuthSession
      tags: [auth]
      summary: End the current authentication session
      security:
        - sessionCookie: []
          csrfToken: []
        - preAuthCookie: []
          csrfToken: []
      responses:
        "204":
          description: Session and pre-authentication cookies cleared
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/auth/devices:
    get:
      operationId: listAuthTrustedDevices
      tags: [auth]
      summary: List trusted browser or app installations
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Trusted installations for the authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustedDevicePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/devices/others:
    delete:
      operationId: revokeOtherAuthTrustedDevices
      tags: [auth]
      summary: Revoke trusted installations except the current one
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Other trusted installations revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtherDevicesRevoked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/devices/{deviceId}:
    delete:
      operationId: revokeAuthTrustedDevice
      tags: [auth]
      summary: Revoke a trusted browser or app installation
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Trusted installation revoked
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/account/email/change/request:
    post:
      operationId: requestAccountEmailChange
      tags: [auth-security]
      summary: Start a verified e-mail change
      description: Requires the current password. Sends the first code to the currently verified e-mail; the current address remains active until the new address is confirmed.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountEmailChangeRequest"
      responses:
        "202":
          description: Code sent to the current verified address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChangeCurrentCodeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/EmailDeliveryUnavailable"
  /v1/auth/account/email/change/confirm-current:
    post:
      operationId: confirmCurrentAccountEmailChange
      tags: [auth-security]
      summary: Confirm access to the current e-mail
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeConfirmInput"
      responses:
        "202":
          description: Current address confirmed; a second code was sent to the proposed new address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChangeNewCodeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/EmailDeliveryUnavailable"
  /v1/auth/account/email/change/confirm-new:
    post:
      operationId: confirmNewAccountEmailChange
      tags: [auth-security]
      summary: Confirm and activate the new e-mail
      description: Updates the account e-mail only after confirming the new address, then sends a security notice to the former address.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeConfirmInput"
      responses:
        "200":
          description: New address confirmed and activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEmailChangeResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/account/password/change/request:
    post:
      operationId: requestAccountPasswordChange
      tags: [auth-security]
      summary: Start an authenticated password change
      description: Requires the current password and sends a code to the current verified e-mail.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPasswordChangeRequest"
      responses:
        "202":
          description: Confirmation code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeCodeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/EmailDeliveryUnavailable"
  /v1/auth/account/password/change/confirm:
    post:
      operationId: confirmAccountPasswordChange
      tags: [auth-security]
      summary: Confirm a password change
      description: Updates the password and revokes all sessions and recognized installations.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeConfirmInput"
      responses:
        "200":
          description: Password changed; the server clears the current session cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPasswordChangeResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/account/deletion/code:
    post:
      operationId: requestAccountDeletionCode
      tags: [auth-security]
      summary: Request the code to schedule account deletion
      description: Requires an active verified session. Sends only the one-time code; scheduling the deletion sends no additional email.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionCodeRequest"
      responses:
        "202":
          description: One-time code sent to the verified address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionCodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/EmailDeliveryUnavailable"
  /v1/auth/account/deletion/confirm:
    post:
      operationId: confirmAccountDeletion
      tags: [auth-security]
      summary: Schedule account deletion after confirming the code
      description: Hides and disables the account immediately, revokes active sessions, and schedules permanent deletion seven days later.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionConfirmation"
      responses:
        "200":
          description: Deletion scheduled; session cookies are cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionScheduled"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Required development database migration has not been applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/auth/account/deletion/restore/code:
    post:
      operationId: requestAccountRestorationCode
      tags: [auth-security]
      summary: Request a code to restore an account pending deletion
      description: Requires the account identifier and current password; the code is sent only to its verified e-mail.
      security:
        - preAuthCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "202":
          description: Restoration code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionCodeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Email delivery or required development database migration unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/auth/account/deletion/restore/confirm:
    post:
      operationId: confirmAccountRestoration
      tags: [auth-security]
      summary: Restore an account pending deletion
      description: Requires the account identifier, current password, and the e-mail code. The user must sign in again after restoration.
      security:
        - preAuthCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRestorationConfirmation"
      responses:
        "200":
          description: Account restored; no session is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRestoredResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Required development database migration has not been applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/accounts/me:
    get:
      operationId: getMyAccount
      tags: [profiles]
      summary: Get the authenticated account profile
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current account view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
