        content:
          type: string
          minLength: 1
          maxLength: 280
        audience:
          type: string
          enum: [public, circles, private]
        format:
          type: string
          enum: [text]
      required: [content, audience]
      additionalProperties: false
    ArticleCreate:
      type: object
      description: Text-only article. Media and external reference previews are not enabled in this slice.
      properties:
        authorId:
          type: string
          format: uuid
          description: Optional compatibility field; must match the authenticated account.
        content:
          type: string
          maxLength: 280
          default: ""
        audience:
          type: string
          enum: [public, circles, private]
        format:
          type: string
          const: article
        article:
          type: object
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 160
            body:
              type: string
              minLength: 1
              maxLength: 50000
          required: [title, body]
          additionalProperties: false
      required: [audience, article]
      additionalProperties: false
    PostPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        nextCursor:
          type: [string, "null"]
      required: [items, nextCursor]

