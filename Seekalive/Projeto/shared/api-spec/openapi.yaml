openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profiles
    description: Public profile views and account settings
  - name: social-graph
    description: Follows, private follow requests, mutual circles, and blocks
  - name: feed
    description: Text posts and articles with server-enforced audience visibility
  - name: auth-security
    description: Authenticated e-mail and password changes
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/auth/account/email/change/request:
    post:
      operationId: requestAccountEmailChange
      tags: [auth-security]
      summary: Start a verified e-mail change
      description: Requires the current password. Sends the first code to the currently verified e-mail; the current address remains active until the new address is confirmed.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountEmailChangeRequest"
      responses:
        "202":
          description: Code sent to the current verified address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChangeCurrentCodeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/EmailDeliveryUnavailable"
  /v1/auth/account/email/change/confirm-current:
    post:
      operationId: confirmCurrentAccountEmailChange
      tags: [auth-security]
      summary: Confirm access to the current e-mail
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeConfirmInput"
      responses:
        "202":
          description: Current address confirmed; a second code was sent to the proposed new address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChangeNewCodeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/EmailDeliveryUnavailable"
  /v1/auth/account/email/change/confirm-new:
    post:
      operationId: confirmNewAccountEmailChange
      tags: [auth-security]
      summary: Confirm and activate the new e-mail
      description: Updates the account e-mail only after confirming the new address, then sends a security notice to the former address.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeConfirmInput"
      responses:
        "200":
          description: New address confirmed and activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEmailChangeResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/account/password/change/request:
    post:
      operationId: requestAccountPasswordChange
      tags: [auth-security]
      summary: Start an authenticated password change
      description: Requires the current password and sends a code to the current verified e-mail.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPasswordChangeRequest"
      responses:
        "202":
          description: Confirmation code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeCodeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/EmailDeliveryUnavailable"
  /v1/auth/account/password/change/confirm:
    post:
      operationId: confirmAccountPasswordChange
      tags: [auth-security]
      summary: Confirm a password change
      description: Updates the password and revokes all sessions and recognized installations.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeConfirmInput"
      responses:
        "200":
          description: Password changed; the server clears the current session cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPasswordChangeResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/AccountUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/accounts/me:
    get:
      operationId: getMyAccount
      tags: [profiles]
      summary: Get the authenticated account profile
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current account view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateMyAccount
      tags: [profiles]
      summary: Update the authenticated account profile
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPatch"
      responses:
        "200":
          description: Updated owner-only account profile, including private registration details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAccountResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/accounts/me/privacy:
    get:
      operationId: getMyPrivacySettings
      tags: [profiles]
      summary: Get authenticated account privacy settings
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current privacy settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacySettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateMyPrivacySettings
      tags: [profiles]
      summary: Update authenticated account privacy settings
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacySettingsWrite"
      responses:
        "200":
          description: Updated privacy settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacySettings"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/profiles/{username}:
    parameters:
      - $ref: "#/components/parameters/Username"
    get:
      operationId: getProfileByUsername
      tags: [profiles]
      summary: Get a visible profile by username
      description: Authentication is optional. Private profile fields are limited according to follow approval and block rules.
      security:
        - sessionCookie: []
        - {}
      responses:
        "200":
          description: Visible profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: getProfileByAccountId
      tags: [profiles]
      summary: Get a visible profile by account ID
      description: Authentication is optional. Blocked accounts are not disclosed.
      security:
        - sessionCookie: []
        - {}
      responses:
        "200":
          description: Visible profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountView"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/social/accounts:
    get:
      operationId: searchAccounts
      tags: [social-graph]
      summary: Search verified accounts by name or username
      description: Requires a verified session, returns a bounded page, and hides blocked accounts.
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Paginated matching accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/social/accounts/{accountId}/followers:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/PageLimit"
      - $ref: "#/components/parameters/PageCursor"
    get:
      operationId: getFollowers
      tags: [social-graph]
      summary: List visible followers
      description: Public profiles are visible without a session. Private profiles require an approved follow. Blocked accounts are hidden.
      security:
        - sessionCookie: []
        - {}
      responses:
        "200":
          description: Paginated follower accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/social/accounts/{accountId}/following:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/PageLimit"
      - $ref: "#/components/parameters/PageCursor"
    get:
      operationId: getFollowing
      tags: [social-graph]
      summary: List visible followed accounts
      description: Public profiles are visible without a session. Private profiles require an approved follow. Blocked accounts are hidden.
      security:
        - sessionCookie: []
        - {}
      responses:
        "200":
          description: Paginated followed accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/social/accounts/{accountId}/follow:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    put:
      operationId: followAccount
      tags: [social-graph]
      summary: Follow a public account or request to follow a private account
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Follow state; private accounts return pending until approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unfollowAccount
      tags: [social-graph]
      summary: Unfollow an account or withdraw a pending request
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Follow edge and any outgoing pending request removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/social/follow-requests:
    get:
      operationId: getIncomingFollowRequests
      tags: [social-graph]
      summary: List incoming private-profile follow requests
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Paginated incoming follow requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowRequestPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/social/follow-requests/{accountId}/accept:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: acceptFollowRequest
      tags: [social-graph]
      summary: Approve a pending follow request
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Request accepted and follow edge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/social/follow-requests/{accountId}/decline:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: declineFollowRequest
      tags: [social-graph]
      summary: Decline a pending follow request
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Request removed if it belongs to the authenticated account
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/social/circles:
    get:
      operationId: getCircle
      tags: [social-graph]
      summary: List accounts followed mutually by the authenticated account
      description: Circle membership is derived from reciprocal accepted follows; there are no separate circle requests.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Paginated mutual follows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CirclePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/social/blocks:
    get:
      operationId: getBlockedAccounts
      tags: [social-graph]
      summary: List accounts blocked by the authenticated account
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Blocked account list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/social/blocks/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    put:
      operationId: blockAccount
      tags: [social-graph]
      summary: Block an account and remove follow edges and pending requests in both directions
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Account blocked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unblockAccount
      tags: [social-graph]
      summary: Remove a block initiated by the authenticated account
      description: Previously removed follow edges and requests are not restored.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Block removed if it was initiated by the authenticated account
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/social/posts:
    post:
      operationId: createSocialPost
      tags: [feed]
      summary: Create a text publication
      description: >
        The authenticated account is always the author. The optional authorId
        is accepted only for compatibility and must equal the session account.
        Media uploads are not enabled; media fields are rejected.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreate"
      responses:
        "201":
          description: Publication created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/social/posts/{postId}:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      operationId: getSocialPost
      tags: [feed]
      summary: Read a publication when its current audience permits
      security:
        - sessionCookie: []
        - {}
      responses:
        "200":
          description: Readable publication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSocialPost
      tags: [feed]
      summary: Delete the authenticated account's publication
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Publication deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/social/articles:
    post:
      operationId: createSocialArticle
      tags: [feed]
      summary: Create a text-only article
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleCreate"
      responses:
        "201":
          description: Article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/social/articles/{postId}:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      operationId: getSocialArticle
      tags: [feed]
      summary: Read an article when its current audience permits
      security:
        - sessionCookie: []
        - {}
      responses:
        "200":
          description: Readable article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/social/accounts/{accountId}/posts:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/PageLimit"
      - $ref: "#/components/parameters/PageCursor"
    get:
      operationId: getSocialAccountPosts
      tags: [feed]
      summary: List currently readable posts or articles on an account profile
      description: >
        Results use stable chronological pagination and re-check profile privacy,
        approved follows, mutual Círculo membership, and bilateral blocks.
      security:
        - sessionCookie: []
        - {}
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [all, text, article]
            default: all
      responses:
        "200":
          description: Paginated readable content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-seekalive_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 20
        description: Username is normalized to lowercase before validation.
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 32
  responses:
    Unauthorized:
      description: Missing, expired, or unverified account session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountUnavailable:
      description: The account is blocked from security-sensitive changes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: CSRF failure, blocked relationship, or inaccessible private profile
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Account or relationship not found or intentionally undisclosed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: Invalid request input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Optimistic concurrency conflict or duplicate username
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: Request limit exceeded; retry after the interval in Retry-After.
      headers:
        Retry-After:
          description: Number of seconds before another request may be accepted.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    EmailDeliveryUnavailable:
      description: The configured e-mail provider is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: Profile data is inconsistent or the server could not complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              minimum: 1000
              maximum: 1899
              description: Unique numeric application/domain error code. HTTP response status is separate transport metadata and is catalogued in shared/contracts/src/errorCodes.ts.
            key:
              type: string
              description: Stable symbolic error key for client-side handling.
            message:
              type: string
            requestId:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                required: [field, message]
            retryAfterSeconds:
              type: integer
              minimum: 1
          required: [code, key, message, requestId]
      required: [error]
    AccountEmailChangeRequest:
      type: object
