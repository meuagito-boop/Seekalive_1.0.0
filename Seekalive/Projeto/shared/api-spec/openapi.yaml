    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        content:
          type: string
          maxLength: 280
        createdAt:
          type: string
          format: date-time
        audience:
          type: string
          enum: [public, circles, private]
        type:
          type: string
